name: CI

# El deploy lo hace Vercel al pushear a main. Este workflow solo verifica
# que los tests y el build pasen en cada push y Pull Request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build
        env:
          # El build exige que estén definidas; no se publica nada, así que
          # alcanza con valores de ejemplo.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_API_BASE_URL: https://api.example.com/
