<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      Aplica el tema guardado antes del primer pintado, para que no se vea un
      destello del tema Clásico. La clave, los ids y los colores deben
      coincidir con src/components/utils/theme.ts (hay un test que lo verifica).
    -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        var metaColors = { dark: "#121214", sunset: "#fff7ed" };
        if (theme && Object.prototype.hasOwnProperty.call(metaColors, theme)) {
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", metaColors[theme]);
        }
      } catch (e) {
        // Sin acceso al almacenamiento: queda el tema Clásico
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/iconoapp.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thinking Notes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
